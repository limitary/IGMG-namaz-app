name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mescid
          POSTGRES_PASSWORD: mescid
          POSTGRES_DB: mescid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mescid" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: mescid
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testdatabases aanmaken
        run: |
          psql -h localhost -U mescid -d mescid -c "create database mescid_test"
          psql -h localhost -U mescid -d mescid -c "create database mescid_e2e"
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgres://mescid:mescid@localhost:5432/mescid
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e

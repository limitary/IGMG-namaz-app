# Lokale database voor ontwikkeling. Niet bedoeld voor productie (geen back-ups, standaardwachtwoord).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mescid
      POSTGRES_PASSWORD: mescid
      POSTGRES_DB: mescid
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mescid-db:/var/lib/postgresql/data
volumes:
  mescid-db:
